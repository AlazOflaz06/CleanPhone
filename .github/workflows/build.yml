name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Zip ac ve derle
        run: |
          mkdir proj
          unzip -q CleanPhone-Android-Project.zip -d proj
          find proj -maxdepth 3 | head -30
          cd "$(dirname "$(find proj -name settings.gradle.kts | head -1)")"
          gradle assembleDebug --no-daemon
      - name: APK dosyasini topla
        run: |
          mkdir out
          cp "$(find proj -name app-debug.apk | head -1)" out/
      - uses: actions/upload-artifact@v4
        with:
          name: CleanPhone-APK
          path: out/app-debug.apk
