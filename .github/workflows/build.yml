name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Zip ac ve duzelt
        run: |
          mkdir proj
          unzip -q CleanPhone-Android-Project.zip -d proj
          python3 - <<'PY'
          import glob
          p = glob.glob('proj/**/Ui.kt', recursive=True)[0]
          s = open(p, encoding='utf-8').read()
          old = 'val penalty = findings.sumOf { when (it.level) { 2 -> 15; 1 -> 7; else -> 0 } }'
          new = 'val penalty: Int = findings.fold(0) { acc, x -> acc + (if (x.level == 2) 15 else if (x.level == 1) 7 else 0) }'
          assert old in s
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))
          PY
      - name: Derle
        run: |
          cd "$(dirname "$(find proj -name settings.gradle.kts | head -1)")"
          gradle assembleDebug --no-daemon
      - name: APK dosyasini topla
        run: |
          mkdir out
          cp "$(find proj -name app-debug.apk | head -1)" out/
      - uses: actions/upload-artifact@v4
        with:
          name: CleanPhone-APK
          path: out/app-debug.apk
